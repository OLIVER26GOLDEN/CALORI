<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Calori</title>

<style>
#auth-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:#f4f6f4}
#auth-overlay.visible{display:flex}
.auth-card{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-family:system-ui,sans-serif}
.auth-card h2{margin:0 0 4px;font-size:22px}
.auth-card p{margin:0 0 16px;color:#666;font-size:14px}
.auth-card input{width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.auth-card .principal{width:100%;padding:12px;border:0;border-radius:10px;background:#2e9d5b;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.auth-card .principal:disabled{opacity:.6}
.auth-card .cambiar{background:none;border:0;color:#2e9d5b;margin-top:12px;cursor:pointer;font-size:14px;width:100%}
#auth-msg{min-height:20px;margin:6px 0 10px;font-size:14px;color:#c0392b}
#auth-msg.ok{color:#2e7d32}
</style>
<style>
:root{--bg:#fff;--s0:#f1f5f9;--s2:#f8fafc;--s3:#eef2f7;--s4:#e2e8f0;--bd:#e2e8f0;--tx:#0f172a;--mu:#64748b;--pr:#047857;--pc:#10b981;--ph:#059669;--am:#d97706;--co:#ea580c;--ro:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
.t{font-weight:700;letter-spacing:-.01em}.mu{color:var(--mu);font-size:12px}
.mi{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mu);letter-spacing:.04em}
.r{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.g{display:grid;gap:8px}
button{font:inherit;font-weight:700;border:1px solid #cbd5e1;background:var(--s4);color:var(--tx);border-radius:22px;height:44px;padding:0 16px}
button.p{background:var(--pc);border-color:var(--pc);color:#fff}button:disabled{opacity:.5}
button.sm{height:34px;font-size:13px;padding:0 12px}
input,select,textarea{font:inherit;width:100%;height:42px;padding:0 12px;border:1px solid #cbd5e1;border-radius:10px;background:var(--s0);color:var(--tx)}
textarea{height:80px;padding:10px}
.seg{display:flex;background:var(--s0);border-radius:20px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border:0;background:none;border-radius:18px;padding:0 4px;font-size:13px}
.seg button.on{background:var(--s4);box-shadow:0 0 0 1px #cbd5e1 inset}
.tile{background:var(--s3);border-radius:16px;padding:12px 16px}
.pill{display:inline-block;border-radius:14px;padding:4px 12px;font-size:12px;font-weight:700}
.bar{height:12px;border-radius:6px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;background:var(--pc);border-radius:6px}
.bar.m{height:6px;background:#fff}
.sec{background:var(--s3);border-radius:14px;padding:10px 12px;margin-top:10px;display:flex;gap:12px;align-items:center}
.sec img,.sec .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--s2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.pl{background:var(--s2);border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;gap:12px;align-items:center}
.n{width:34px;height:34px;border-radius:17px;background:#dcefe7;color:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.vis{height:190px;border-radius:16px;background:var(--s2);border:1px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;color:var(--mu);overflow:hidden}
.vis{position:relative}
.vis img{width:100%;height:100%;object-fit:cover}
.vis.scan::before{content:"";position:absolute;inset:0;background:rgba(16,185,129,.12);z-index:1}
.vis.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc);box-shadow:0 0 14px 5px rgba(16,185,129,.75);z-index:2;animation:scan 1.5s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
.av{width:44px;height:44px;border-radius:22px;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover}
.hide{display:none}
main{padding-bottom:96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:140px;height:60px;border:0;border-radius:0;background:none;color:var(--mu);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--pr)}
</style></head><body>

  let h=`<div class="card" style="padding:14px 18px">${vPlanCard()}</div><div class="card"><div class="r"><div>${anillo(pct,col)}</div><div><div class="mi">Hoy llevas</div><div><span class="t" style="font-size:42px">${Math.round(tot.k)}</span><span class="mu" style="font-size:14px"> / ${lim} kcal</span></div>
  <span class="pill" style="color:${col};background:${resto<0?"#fbe4e4":"#dcefe7"}">${resto>=0?`Te quedan ${Math.round(resto)} kcal`:`Te has pasado ${Math.round(-resto)} kcal`}</span></div></div>
  <div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:14px">${metas.map(([n,k,m,c])=>`<div class="tile" style="padding:10px 10px"><div class="mi" style="color:${c};font-size:9px">${n}</div><div><b style="font-size:20px">${Math.round(tot[k])}</b><span class="mu"> / ${Math.round(m)} g</span></div><div class="bar m" style="margin-top:6px"><i style="width:${m?Math.min(tot[k]/m,1)*100:0}%;background:${c}"></i></div></div>`).join("")}</div></div>`;
  h+=`<!--A--><div class="card"><div class="t" style="font-size:18px">Escanear comida</div><div class="mu" style="margin-bottom:8px">Elige la comida, sube su foto y la IA estima calorías y macros</div>
  <div class="seg" style="margin-bottom:10px">${C.map(s=>`<button style="font-size:11px;${pend[s]?"color:var(--pr)":""}" class="${s===slot?"on":""}" onclick="slot='${s}';msg='';render()">${s}</button>`).join("")}</div>
  <div class="vis${busy&&scanSlot===slot?" scan":""}">${pv?`<img src="${pv.thumb}">`:e?.foto?`<img src="${e.foto}">`:"Elige una foto de tu plato"}</div>
  <div class="g" style="grid-template-columns:1fr 1fr;margin-top:12px"><button onclick="$('#gal').click()">Elegir foto</button><button onclick="$('#cam').click()">Hacer foto</button></div>
  <button class="p" style="width:100%;margin-top:8px" ${busy||!pv?"disabled":""} onclick="analizar([slot])">Analizar comida</button>
  <button class="p" style="width:100%;margin-top:8px" ${busy||!nPend?"disabled":""} onclick="analizar(C.filter(s=>pend[s]))">Analizar todas${nPend>1?` (${nPend})`:""}</button>
  <button style="width:100%;margin-top:8px" ${busy||!pv?"disabled":""} onclick="vaciarFoto()">Vaciar foto</button>
  <div class="mu" style="margin-top:8px">${esc(msg)}</div></div>`;
  h+=`<!--A--><div class="card"><div class="r sb"><div class="r"><span class="t" style="font-size:18px">Comidas de ${fecha===hoy()?"hoy":fecha}</span><span class="pill" style="background:#dcefe7;color:var(--pr)">${np} plato${np!==1?"s":""}</span></div></div>
  <div class="r" style="margin:8px 0 0"><input type="date" value="${fecha}" onchange="fecha=this.value||hoy();render()" style="flex:1"><button class="sm" onclick="vaciar()">Vaciar día</button></div>`;
  for(const s of C){const en=dias[fecha]?.[s],pl=platosDe(fecha,s),k=pl.reduce((a,p)=>a+num(p.calorias),0),ob=Math.round(lim*R[s]);
    h+=`<div class="sec">${en?.foto?`<img src="${en.foto}">`:'<div class="ph">—</div>'}<div style="flex:1"><div class="t" style="font-size:15px">${s}</div><div class="mu">${esc(en?en.resultado.comentario||"":"Sin foto todavía")}</div></div><div style="text-align:right"><div class="t" style="font-size:20px;color:${k>ob?"var(--ro)":en?"var(--pr)":"var(--mu)"}">${Math.round(k)}</div><div class="mi">de ${ob} kcal</div></div></div>`;
    pl.forEach((p,i)=>h+=`<div class="pl"><div class="n">${i+1}</div><div style="flex:1"><div class="t">${esc(p.nombre||"?")}</div><div class="mu">${s}${p.gramos_estimados!==undefined?` · ${esc(p.gramos_estimados)} g`:""}</div>
    <div style="margin-top:3px"><span class="pill" style="font-size:11px;color:var(--ph);background:#e3f3ec">P ${esc(p.proteinas_g??0)} g</span> <span class="pill" style="font-size:11px;color:var(--am);background:#faefdc">C ${esc(p.carbohidratos_g??0)} g</span> <span class="pill" style="font-size:11px;color:var(--co);background:#fbe9de">G ${esc(p.grasas_g??0)} g</span></div></div>
    <div style="text-align:right"><div class="t" style="font-size:22px">${esc(p.calorias??0)}</div><div class="mi">kcal</div></div></div>`)}
  h+=`<div class="mu" style="margin-top:12px">Las calorías son estimaciones de la IA, no un consejo médico.</div></div>`;
  
  if(perfil&&!wz)h+=`<!--A--><div class="card">${vMenu()}</div>`;
  const P=h.split("<!--A-->");return tab==="Inicio"?P[0]+P[1]:tab==="Hoy"?P[2]:(P[3]||"");
}
function vaciarFoto(){if(!pend[slot])return;delete pend[slot];msg="";render()}
function vaciar(){if(confirm("Se borrarán las comidas y fotos de este día.\n¿Continuar?")){borrarDia(fecha);delete dias[fecha];W("dias",dias);render()}}
function vPerfil(){
  let d="";
  if(perfil){const pl=planDe(perfil);d=!pl.kg?"Tu límite es de mantenimiento.":`Para pasar de ${perfil.peso} a ${perfil.peso_objetivo} kg en ${fmtPlazo(pl.dias)} te corresponden unas ${pl.objetivo} kcal al día (${pl.ritmo.toFixed(2)} kg/semana).`+(pl.dmin===null?"\nCon tu gasto actual no se puede bajar de peso de forma segura.":pl.limitado?`\nEse plazo es demasiado rápido: el mínimo es ${fmtPlazo(pl.dmin)}. Con este límite lo lograrías en unos ${fmtPlazo(pl.dreal)}.`:`\nPlazo sostenible recomendado: ${fmtPlazo(pl.drec)}.`)}
  return`<div class="card"><div class="r" style="gap:14px">${avatar?`<img class="av" style="width:72px;height:72px;border-radius:36px" src="${avatar}">`:`<div class="av" style="width:72px;height:72px;border-radius:36px;font-size:28px">👤</div>`}
  <div class="g"><button class="sm" onclick="$('#avf').click()">Elegir foto de perfil</button>${avatar?`<button class="sm" onclick="avatar='';W('avatar','');render()">Quitar foto</button>`:""}</div></div></div>
  <div class="card"><div class="t" style="font-size:18px;margin-bottom:8px">Tus datos</div>${perfil?`<div class="mu" style="font-size:14px;line-height:1.7">${perfil.sexo} · ${perfil.edad} años · ${perfil.altura} cm · ${perfil.peso} kg<br>${esc(perfil.actividad)}<br>Objetivo: ${perfil.meta}${perfil.meta!=="Mantener"?` (${perfil.peso_objetivo} kg)`:""}</div><div style="white-space:pre-line;margin-top:10px">${esc(d)}</div>`:'<div class="mu">Aún no has rellenado tu plan.</div>'}
  <button class="p" style="width:100%;margin-top:12px" onclick="wizIni();tab='Inicio';render()">${perfil?"Cambiar mi plan paso a paso":"Crear mi plan"}</button></div>
  <div class="card"><div class="t" style="font-size:18px;margin-bottom:8px">Sugerencias</div><textarea id="sug" placeholder="Cuéntanos qué mejorarías…"></textarea>
  <button style="width:100%;margin-top:8px" onclick="location.href='mailto:${EMAIL}?subject='+encodeURIComponent('[Calori] Sugerencia')+'&body='+encodeURIComponent($('#sug').value)">Enviar sugerencia por correo</button></div>
  <div class="card"><div class="mu" style="margin-bottom:8px">Sesión iniciada como ${esc(window.usuarioActual?window.usuarioActual.email:"")}</div><button style="width:100%" onclick="cerrarSesion()">Cerrar sesión</button></div>`;
}
function vCfg(){
  if(srv)return`<div class="card"><div class="t" style="font-size:18px">Configuración</div><div class="mu" style="margin-top:6px;font-size:14px">✓ Todo listo: el análisis de fotos funciona sin que tengas que poner ninguna clave. Tus datos se guardan solo en este móvil.</div></div>`;
  return`<div class="card"><div class="t" style="font-size:18px">Configuración</div><div class="mu" style="margin-bottom:10px">Hasta 3 APIs de IA: si una falla se prueba la siguiente. Las claves se guardan solo en este móvil.</div>
  ${cfg.apis.map((a,i)=>`<div class="tile" style="margin-bottom:10px"><div class="mi">API ${i+1}</div>
  <select style="margin:6px 0" onchange="cfg.apis[${i}].prov=this.value;W('cfg',cfg);render()">${Object.keys(PROV).map(p=>`<option ${p===a.prov?"selected":""}>${p}</option>`).join("")}</select>
  <input type="password" autocomplete="off" placeholder="Clave API" value="${esc(a.key)}" onchange="cfg.apis[${i}].key=this.value.trim();W('cfg',cfg)" style="margin-bottom:6px">
  <input placeholder="Modelo (vacío = ${PROV[a.prov]||"obligatorio"})" value="${esc(a.model)}" onchange="cfg.apis[${i}].model=this.value.trim();W('cfg',cfg)">
  ${a.prov.startsWith("Otra")?`<input placeholder="URL base (https://api.groq.com/openai/v1)" value="${esc(a.base)}" onchange="cfg.apis[${i}].base=this.value.trim();W('cfg',cfg)" style="margin-top:6px">`:""}</div>`).join("")}</div>`;
}
const NAV=[["Inicio","🏠","Inicio"],["Hoy","🍽️","Comidas de hoy"],["Menú","✨","Comidas del día"],["Perfil","👤","Perfil"]];
function render(){
  const nv=$("#nav");nv.style.display=wz?"none":"flex";
  nv.innerHTML=NAV.map(([t,i,l])=>`<button class="${t===tab?"on":""}" onclick="tab='${t}';msg='';scrollTo(0,0);render()"><span>${i}</span>${l}</button>`).join("");
  const y=scrollY;
  if(wz){const first=!perfil;$("#a").innerHTML=(first?`<div class="r" style="margin:6px 0 14px"><img src="${LOGO}" width="48" height="52" alt=""><div><div class="t" style="font-size:20px">Calori</div><div class="mu">Come bien, conoce tus calorías</div></div></div><div class="mu" style="margin-bottom:10px">Contesta unas preguntas para calcular tu plan.</div>`:"")+`<div class="card">${vWiz()}</div>`;scrollTo(0,first?0:y);return}
  $("#a").innerHTML=cabecera()+(tab==="Perfil"?vPerfil()+(srv?"":vCfg()):vDia());scrollTo(0,y);
}
/* Nuevo día: pantalla en blanco para hacer fotos nuevas; se borran las fotos de días anteriores (se conservan las calorías y la racha) */
let diaApp=hoy();
function limpiarFotos(){let c=false;const h=hoy();for(const f in dias)if(f<h)for(const s of C)if(dias[f]?.[s]?.foto){delete dias[f][s].foto;c=true}if(c)W("dias",dias)}
function chequeaDia(){if(hoy()!==diaApp){diaApp=hoy();fecha=diaApp;pend={};slot=C[0];msg="¡Nuevo día! Ya puedes hacer tus fotos.";limpiarFotos();render()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)chequeaDia()});
setInterval(chequeaDia,30000);
limpiarFotos();
fetch("/api/estado").then(r=>{if(r.ok)srv=true}).catch(()=>{}).finally(()=>{if(!perfil)wizIni();else render()});
</script>
<script>
const sb = supabase.createClient(
  'https://icvlhmqmwzyrvoosaimb.supabase.co',
  'sb_publishable_2e1gN56fuG4TraMZb-oUQA_bwLcF_hD'
);

let modoRegistro = false;

function mensaje(texto, ok = false) {
  const el = document.getElementById('auth-msg');
  el.textContent = texto;
  el.className = ok ? 'ok' : '';
}

function cambiarModo() {
  modoRegistro = !modoRegistro;
  document.getElementById('auth-titulo').textContent = modoRegistro ? 'Crea tu cuenta' : 'Inicia sesión';
  document.getElementById('auth-btn').textContent = modoRegistro ? 'Registrarme' : 'Entrar';
  document.getElementById('auth-cambiar').textContent = modoRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
  document.getElementById('auth-pass').autocomplete = modoRegistro ? 'new-password' : 'current-password';
  mensaje('');
}

function traducirError(err) {
  const m = (err.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'Correo o contraseña incorrectos.';
  if (m.includes('already registered')) return 'Ese correo ya tiene cuenta. Inicia sesión.';
  if (m.includes('password')) return 'La contraseña debe tener al menos 6 caracteres.';
  if (m.includes('rate limit')) return 'Demasiados intentos. Espera un poco.';
  if (m.includes('email not confirmed')) return 'Confirma tu correo antes de entrar.';
  return 'Error: ' + err.message;
}

async function enviarAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  if (!email || !password) { mensaje('Escribe tu correo y contraseña.'); return; }
  const btn = document.getElementById('auth-btn');
  btn.disabled = true; mensaje('');
  try {
    if (modoRegistro) {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) mensaje('Te hemos enviado un correo para confirmar tu cuenta.', true);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    mensaje(traducirError(err));
  } finally {
    btn.disabled = false;
  }
}

async function cerrarSesion() { await sb.auth.signOut(); }

function actualizarPantalla(session) {
  window.usuarioActual = session ? session.user : null;
  document.getElementById('auth-overlay').classList.toggle('visible', !session);
  if (!session) uidSync = null;
}

/* ---------- datos en Supabase ---------- */
let uidSync = null;

async function sincronizar(user) {
  if (!user || uidSync === user.id) return;
  uidSync = user.id;
  try {
    // si el móvil tenía datos de otra cuenta, se descartan
    const owner = L("owner", null);
    if (owner && owner !== user.id) {
      perfil = null; dias = {}; avatar = "";
      W("perfil", null); W("dias", {}); W("avatar", "");
    }
    W("owner", user.id);

    const [rp, rc] = await Promise.all([
      sb.from("perfiles").select("*").eq("id", user.id).maybeSingle(),
      sb.from("comidas").select("fecha,tipo,resultado").eq("usuario_id", user.id).limit(5000)
    ]);
    if (rp.error) throw rp.error;
    if (rc.error) throw rc.error;

    // comidas: lo de la nube manda; se conservan las fotos locales
    const enNube = new Set();
    for (const r of rc.data) {
      enNube.add(r.fecha + "|" + r.tipo);
      const loc = dias[r.fecha] && dias[r.fecha][r.tipo];
      const e = { resultado: r.resultado };
      if (loc && loc.foto) e.foto = loc.foto;
      (dias[r.fecha] = dias[r.fecha] || {})[r.tipo] = e;
    }
    // lo que solo estaba en el móvil (historial anterior) se sube
    const subir = [];
    for (const f in dias) for (const t of C) {
      if (dias[f][t] && dias[f][t].resultado && !enNube.has(f + "|" + t))
        subir.push({ usuario_id: user.id, fecha: f, tipo: t, resultado: dias[f][t].resultado });
    }
    if (subir.length) {
      const { error } = await sb.from("comidas").upsert(subir, { onConflict: "usuario_id,fecha,tipo" });
      if (error) throw error;
    }

    // perfil
    if (rp.data) {
      const { id, actualizado_en, ...p } = rp.data;
      perfil = p;
    } else if (perfil) {
      await guardarPerfil();
    }
    W("perfil", perfil); W("dias", dias);
    if (perfil) wz = null;
  } catch (e) {
    console.error(e);
    uidSync = null;
    msg = "No se pudo sincronizar con la nube: " + (e.message || e);
  }
  if (!perfil && !wz) wizIni(); else render();
}

async function guardarPerfil() {
  const u = window.usuarioActual;
  if (!u || !perfil) return;
  const { error } = await sb.from("perfiles").upsert({ id: u.id, ...perfil, actualizado_en: new Date().toISOString() });
  if (error) { console.error(error); msg = "No se pudo guardar tu plan en la nube: " + error.message; render(); }
}

async function guardarComida(f, s) {
  const u = window.usuarioActual;
  if (!u || !dias[f] || !dias[f][s]) return;
  const { error } = await sb.from("comidas").upsert(
    { usuario_id: u.id, fecha: f, tipo: s, resultado: dias[f][s].resultado },
    { onConflict: "usuario_id,fecha,tipo" });
  if (error) { console.error(error); msg = "No se pudo guardar en la nube: " + error.message; render(); }
}

async function borrarDia(f) {
  const u = window.usuarioActual;
  if (!u) return;
  const { error } = await sb.from("comidas").delete().eq("usuario_id", u.id).eq("fecha", f);
  if (error) console.error(error);
}

sb.auth.getSession().then(({ data }) => {
  actualizarPantalla(data.session);
  if (data.session) setTimeout(() => sincronizar(data.session.user), 0);
});
sb.auth.onAuthStateChange((_evento, session) => {
  actualizarPantalla(session);
  if (session) setTimeout(() => sincronizar(session.user), 0);
});
</script>
